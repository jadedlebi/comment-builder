<!DOCTYPE html>
<html>
<head>
    <title>reCAPTCHA Test</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6LfEwLsrAAAAAIc_nXYEfDT6Bk7Rl2E7_VjMdjn1"></script>
</head>
<body>
    <h1>reCAPTCHA Test</h1>
    <button onclick="testRecaptcha()">Test reCAPTCHA</button>
    <div id="result"></div>

    <script>
        function testRecaptcha() {
            grecaptcha.ready(function() {
                grecaptcha.execute('6LfEwLsrAAAAAIc_nXYEfDT6Bk7Rl2E7_VjMdjn1', {action: 'submit'})
                    .then(function(token) {
                        console.log('Token generated:', token);
                        document.getElementById('result').innerHTML = 
                            '<p>Token: ' + token + '</p>' +
                            '<p>Length: ' + token.length + '</p>';
                        
                        // Test the token with the API
                        testTokenWithAPI(token);
                    })
                    .catch(function(error) {
                        console.error('reCAPTCHA error:', error);
                        document.getElementById('result').innerHTML = '<p>Error: ' + error + '</p>';
                    });
            });
        }

        async function testTokenWithAPI(token) {
            try {
                const response = await fetch('https://www.google.com/recaptcha/api/siteverify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `secret=6LfEwLsrAAAAAEokqe7CdvyDrrTsptFMWe2aKBrH&response=${token}`
                });
                
                const data = await response.json();
                console.log('API Response:', data);
                document.getElementById('result').innerHTML += 
                    '<p>API Response: ' + JSON.stringify(data, null, 2) + '</p>';
            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('result').innerHTML += '<p>API Error: ' + error + '</p>';
            }
        }
    </script>
</body>
</html>
