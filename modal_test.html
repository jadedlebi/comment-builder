<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test - Real Time Editing</title>
    <style>
        /* Reset and base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            color: #1e293b;
            line-height: 1.6;
        }

        /* Button styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2fade3 0%, #1e90c7 100%);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(47, 173, 227, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1e90c7 0%, #0f7bb8 100%);
            box-shadow: 0 6px 20px 0 rgba(47, 173, 227, 0.4);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: #374151;
            border: 2px solid #d1d5db;
        }

        .btn-outline:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #9ca3af;
            color: #6b7280;
        }

        /* CRITICAL: Button vertical alignment */
        .btn-vertical {
            display: block !important;
            width: 100% !important;
            margin: 0 !important;
        }

        /* Force modal button containers to be vertical */
        .mt-8.pt-6.border-t.border-gray-200 .flex.flex-col.gap-3,
        .p-6.pt-4.border-t.border-gray-200 .flex.flex-col.gap-3 {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        /* Nuclear option - force all modal button containers */
        div[class*="flex"][class*="gap-3"] {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        /* Form styles */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #2fade3;
            box-shadow: 0 0 0 3px rgba(47, 173, 227, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Utility classes */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-3 { gap: 12px; }
        .space-y-4 > * + * { margin-top: 16px; }
        .p-4 { padding: 16px; }
        .p-6 { padding: 24px; }
        .pt-4 { padding-top: 16px; }
        .pb-4 { padding-bottom: 16px; }
        .mt-8 { margin-top: 32px; }
        .pt-6 { padding-top: 24px; }
        .border-t { border-top: 1px solid #e5e7eb; }
        .border-gray-200 { border-color: #e5e7eb; }
        .bg-white { background-color: white; }
        .rounded-lg { border-radius: 8px; }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .relative { position: relative; }
        .text-xl { font-size: 20px; }
        .text-lg { font-size: 18px; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .text-gray-900 { color: #111827; }
        .text-gray-500 { color: #6b7280; }
        .text-sm { font-size: 14px; }
        .w-full { width: 100%; }
        .h-2 { height: 8px; }
        .bg-gray-200 { background-color: #e5e7eb; }
        .bg-blue-600 { background-color: #2563eb; }
        .rounded-full { border-radius: 9999px; }
        .transition-all { transition-property: all; }
        .duration-300 { transition-duration: 300ms; }
        .ease-in-out { transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .overflow-y-auto { overflow-y: auto; }
        .flex-1 { flex: 1 1 0%; }
        .h-full { height: 100%; }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
        }

        .modal-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            width: 700px;
            max-height: 90vh;
            min-height: 400px;
        }

        /* Close button */
        .close-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: #374151;
            background-color: #f3f4f6;
        }

        /* Test buttons */
        .test-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            display: flex;
            gap: 10px;
        }

        .test-btn {
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .test-btn:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <!-- Test Controls -->
    <div class="test-controls">
        <button class="test-btn" onclick="showAddModal()">Show Add Modal</button>
        <button class="test-btn" onclick="showEditModal()">Show Edit Modal</button>
        <button class="test-btn" onclick="hideModals()">Hide All</button>
    </div>

    <!-- Add New Rulemaking Modal -->
    <div id="addModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-6 pb-4 border-t border-gray-200">
                <div>
                    <h3 class="text-xl font-semibold text-gray-900">Add New Rulemaking</h3>
                    <p class="text-sm text-gray-500 mt-1">Step 1 of 2</p>
                </div>
                <button class="close-btn" onclick="hideModals()" aria-label="Close modal">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="px-6 pb-4">
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 50%;"></div>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 p-6">
                <form class="h-full flex flex-col">
                    <div class="flex-1 transition-all duration-300 ease-in-out">
                        <div class="space-y-4">
                            <h4 class="text-lg font-medium text-gray-900 mb-4">Basic Information</h4>
                            <div class="form-group">
                                <label class="form-label">Title *</label>
                                <input type="text" required class="form-input" placeholder="Enter rulemaking title" value="">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Agency *</label>
                                <input type="text" required class="form-input" placeholder="e.g., CFPB" value="">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Docket Number *</label>
                                <input type="text" required class="form-input" placeholder="e.g., CFPB-2025-0018" value="">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Comment Deadline *</label>
                                <input type="date" required class="form-input" value="">
                            </div>
                        </div>
                    </div>

                    <!-- Form Footer - Buttons -->
                    <div class="mt-8 pt-6 border-t border-gray-200">
                        <div class="flex flex-col gap-3" style="display: flex; flex-direction: column; gap: 12px;">
                            <button type="button" class="btn btn-outline btn-vertical">
                                Cancel
                            </button>
                            <button type="button" disabled class="btn btn-primary btn-vertical">
                                Next →
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Rulemaking Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-6 pb-4 border-t border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">Edit Rulemaking</h3>
                <button class="close-btn" onclick="hideModals()" aria-label="Close modal">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Scrollable Modal Body -->
            <div class="flex-1 overflow-y-auto p-4">
                <form class="space-y-4">
                    <div class="form-group">
                        <label class="form-label">Title *</label>
                        <input type="text" required class="form-input" placeholder="Enter rulemaking title" value="Legal Standard Applicable to Supervisory Designation Proceedings">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Agency *</label>
                        <input type="text" required class="form-input" placeholder="e.g., CFPB" value="CFPB">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Docket Number *</label>
                        <input type="text" required class="form-input" placeholder="e.g., CFPB-2025-0018" value="CFPB-2025-0018">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Comment Deadline *</label>
                        <input type="date" required class="form-input" value="2025-09-25">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" rows="3" placeholder="Enter rulemaking description">The Consumer Financial Protection Bureau (CFPB) is proposing to change its rules to require "high likelihood of significant harm" before it can investigate financial companies, instead of the current "reasonable cause" standard. This could prevent the CFPB from investigating companies that pose a risk to consumers.</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">NCRC Comment Letter</label>
                        <textarea class="form-input" rows="4" placeholder="Paste the NCRC comment letter here. This will be used as context for AI-generated personalized comments.">Paste the NCRC comment letter here. This will be used as context for AI-generated personalized comments.</textarea>
                        <p class="text-sm text-gray-500 mt-1">
                            This letter will be used as context for generating personalized comments. Users will not see this directly.
                        </p>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 pt-4 border-t border-gray-200">
                <div class="flex flex-col gap-3" style="display: flex; flex-direction: column; gap: 12px;">
                    <button type="button" class="btn btn-outline btn-vertical">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary btn-vertical">
                        Update Rulemaking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showAddModal() {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('editModal').style.display = 'none';
        }

        function showEditModal() {
            document.getElementById('editModal').style.display = 'flex';
            document.getElementById('addModal').style.display = 'none';
        }

        function hideModals() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('editModal').style.display = 'none';
        }

        // Close modals when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal-overlay')) {
                hideModals();
            }
        });
    </script>
</body>
</html>
